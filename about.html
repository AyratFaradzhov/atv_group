      <section class="cooperation__panels">
  <div class="cooperation__tabs">
    <button
      type="button"
      class="cooperation__tab cooperation__tab--active"
      data-i18n="cooperation_tab_partner"
    ></button>

    <button
      type="button"
      class="cooperation__tab"
      data-i18n="cooperation_tab_manufacturer"
    ></button>
  </div>

  <!-- PARTNER -->
  <div class="cooperation__panel cooperation__panel--active">
    <h2 class="cooperation__title" data-i18n="cooperation_title_partner"></h2>
    <p
      class="cooperation__subtitle"
      data-i18n="cooperation_subtitle_partner"
    ></p>

    <form class="partner-form">
      <input
        class="partner-form__input"
        type="text"
        name="partner_fullname"
        placeholder="ФИО"
      />

      <input
        class="partner-form__input"
        type="tel"
        name="partner_phone"
        placeholder="Номер телефона"
      />

      <input
        class="partner-form__input"
        type="email"
        name="partner_email"
        placeholder="Почта"
      />

      <textarea
        class="partner-form__textarea"
        name="partner_message"
        placeholder="Ваше сообщение (не обязательно)"
      ></textarea>

      <button
        class="partner-form__submit"
        type="submit"
        data-i18n="partner_button_submit"
      ></button>

      <label class="partner-form__policy">
        <input type="checkbox" checked />
        <span data-i18n="partner_policy_text"></span>
      </label>
    </form>
  </div>

  <!-- MANUFACTURER -->
  <div class="cooperation__panel">
    <h2
      class="cooperation__title"
      data-i18n="cooperation_title_manufacturer"
    ></h2>

    <p
      class="cooperation__subtitle"
      data-i18n="cooperation_subtitle_manufacturer"
    ></p>

    <form class="manufacturer-form">
      <input
        class="manufacturer-form__input"
        type="text"
        name="manufacturer_company"
        placeholder="Название компании"
      />

      <input
        class="manufacturer-form__input"
        type="text"
        name="manufacturer_contact"
        placeholder="Контактное лицо"
      />

      <input
        class="manufacturer-form__input"
        type="tel"
        name="manufacturer_phone"
        placeholder="Телефон"
      />

      <input
        class="manufacturer-form__input"
        type="email"
        name="manufacturer_email"
        placeholder="Почта"
      />

      <textarea
        class="manufacturer-form__textarea"
        name="manufacturer_message"
        placeholder="Кратко опишите предложение"
      ></textarea>

      <button
        class="manufacturer-form__submit"
        type="submit"
        data-i18n="manufacturer_button_submit"
      ></button>

      <label class="manufacturer-form__policy">
        <input type="checkbox" checked />
        <span data-i18n="manufacturer_policy_text"></span>
      </label>
    </form>
  </div>
